name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true
      - name: Install dependencies
        run: |
          cd app
          flutter pub get
      - name: Build APK
        id: build_step
        run: |
          cd app
          flutter build apk --release --no-tree-shake-icons
      - name: Collect APK
        if: always()
        run: |
          mkdir -p release-apk
          find . -name "*.apk" -exec cp -v {} release-apk/ \; || true
          ls -la release-apk/ || true
      - name: Publish Diagnostics to Summary
        if: always()
        run: |
          echo "## Build Diagnostics" >> $GITHUB_STEP_SUMMARY
          echo "- **Outcome**: ${{ steps.build_step.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "### Discovered APK files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "*.apk" -ls >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build_step.outcome }}" != "success" ]; then
            echo "### Detailed Gradle Stacktrace" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            (cd app/android && ./gradlew assembleRelease --stacktrace) >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swachhand-release-apk
          path: release-apk/*.apk
          if-no-files-found: error


